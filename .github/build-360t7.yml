name: 360T7 ImmortalWrt 25.12 (闭源 WiFi)

on:
  workflow_dispatch:
    inputs:
      SOURCE_BRANCH:
        description: '源码分支（25.12 = 稳定线；openwrt-25.12 = 跟随官方；25.12-dev-wifi7 = WiFi7 实验）'
        required: true
        default: '25.12'
        type: choice
        options:
          - 25.12
          - openwrt-25.12
          - 25.12-dev-wifi7
      DEVICE_PROFILE:
        description: '机型 profile（360T7 原厂布局 = qihoo_360t7；整盘 UBI 布局 = qihoo_360t7-ubi）'
        required: true
        default: 'qihoo_360t7'
        type: choice
        options:
          - qihoo_360t7
          - qihoo_360t7-ubi
      VERSION_NUMBER:
        description: '固件显示的版本号'
        required: true
        default: '25.12.2'
        type: string
      ENABLE_HNAT:
        description: '开启 MTK PPE 硬件加速（HNAT）'
        required: false
        default: true
        type: boolean
      CLEAN_BUILD:
        description: '纯净版：去掉 passwall / ssr-plus / vssr 等代理插件'
        required: false
        default: false
        type: boolean
      EXTRA_PACKAGES:
        description: '额外要装的包（空格分隔，可留空）'
        required: false
        default: ''
        type: string

env:
  REPO_URL: https://github.com/chasey-dev/immortalwrt-mt798x-rebase
  TZ: Asia/Shanghai

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: 释放磁盘空间
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          sudo docker image prune --all --force 2>/dev/null || true
          df -h /

      - name: 安装编译依赖
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ack antlr3 asciidoc autoconf automake autopoint \
            binutils bison build-essential bzip2 ccache clang cmake cpio curl \
            device-tree-compiler ecj fastjar flex gawk gettext gcc-multilib g++-multilib \
            git gnutls-dev gperf haveged help2man intltool libc6-dev-i386 libelf-dev \
            libglib2.0-dev libgmp3-dev libltdl-dev libmpc-dev libmpfr-dev libncurses-dev \
            libpython3-dev libreadline-dev libssl-dev libtool libyaml-dev libz-dev lld llvm \
            lrzsz mkisofs msmtp nano ninja-build p7zip p7zip-full patch pkgconf \
            python3 python3-pip python3-ply python3-docutils python3-pyelftools \
            qemu-utils re2c rsync scons squashfs-tools subversion swig texinfo uglifyjs \
            upx-ucl unzip vim wget xmlto xxd zlib1g-dev zstd
          gcc --version | head -1

      - name: 拉取源码
        run: |
          git clone --single-branch --branch "${{ inputs.SOURCE_BRANCH }}" --depth=1 "$REPO_URL" src
          cd src && git log -1 --oneline

      - name: 打印内核版本
        run: |
          cd src
          echo "KERNEL_PATCHVER: $(grep -m1 '^KERNEL_PATCHVER' target/linux/mediatek/Makefile)"
          echo "LINUX_VERSION:   $(grep -m1 '^LINUX_VERSION-' target/linux/generic/kernel-*)"
          echo "mtwifi:          $(grep -m1 '^PKG_VERSION' package/mtk/drivers/mt_wifi/Makefile 2>/dev/null || true)"

      - name: 更新并安装 feeds
        run: |
          cd src
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: 开启 MTK HNAT（内核层开关）
        if: ${{ inputs.ENABLE_HNAT }}
        working-directory: src
        run: |
          set -euo pipefail
          # NET_MEDIATEK_HNAT 由源码树的 mtkhnat 补丁引入，在子目标内核配置里默认是关的。
          # 它不是 CONFIG_KERNEL_* 级别的符号，写进 .config 会被 defconfig 丢掉，
          # 所以必须直接改 target/linux/mediatek/filogic/config-*。
          cfg=""
          for f in target/linux/mediatek/filogic/config-*; do cfg="$f"; break; done
          [ -n "$cfg" ] || { echo "::error::找不到 filogic 内核配置文件"; exit 1; }
          sed -i 's/^# CONFIG_NET_MEDIATEK_HNAT is not set$/CONFIG_NET_MEDIATEK_HNAT=y/' "$cfg"
          grep -q '^CONFIG_NET_MEDIATEK_HNAT=y$' "$cfg" || {
            echo "::error::无法在 $cfg 中开启 NET_MEDIATEK_HNAT"; exit 1; }
          echo "已开启: $cfg -> CONFIG_NET_MEDIATEK_HNAT=y"

      - name: 生成 .config（只编 360T7）
        working-directory: src
        run: |
          set -euo pipefail
          cp -f defconfig/mt7981-ax3000.config .config

          # 删掉全部机型开关，只保留目标机型，避免编一堆无关设备
          sed -i '/^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_/d' .config
          {
            echo "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${{ inputs.DEVICE_PROFILE }}=y"
            echo "CONFIG_TARGET_DEVICE_PACKAGES_mediatek_filogic_DEVICE_${{ inputs.DEVICE_PROFILE }}=\"\""
          } >> .config

          # 版本号
          {
            echo "CONFIG_VERSION_DIST=\"ImmortalWrt\""
            echo "CONFIG_VERSION_NUMBER=\"${{ inputs.VERSION_NUMBER }}\""
            echo "CONFIG_VERSION_CODE=\"${{ inputs.VERSION_NUMBER }}\""
          } >> .config

          # 纯净版：移除代理类插件
          if [ "${{ inputs.CLEAN_BUILD }}" = "true" ]; then
            sed -i '/^CONFIG_PACKAGE_luci-app-\(passwall\|ssr-plus\|vssr\|openclash\|bypass\)/d' .config
            sed -i '/^CONFIG_PACKAGE_luci-i18n-\(passwall\|ssr-plus\|vssr\|openclash\|bypass\)/d' .config
          fi

          # 额外包
          if [ -n "${{ inputs.EXTRA_PACKAGES }}" ]; then
            for p in ${{ inputs.EXTRA_PACKAGES }}; do echo "CONFIG_PACKAGE_$p=y" >> .config; done
          fi

          make defconfig

          echo "=== 目标机型 ==="
          grep '^CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_' .config || true
          echo "=== 闭源 WiFi / 硬件加速 ==="
          grep -E '^(CONFIG_MTK_MT_WIFI|CONFIG_MTK_MT_WIFI_DRIVER_VERSION_|CONFIG_MTK_CHIP_MT7981|CONFIG_MTK_WARP_V2)=' .config || true
          grep -E '^CONFIG_PACKAGE_(kmod-mt_wifi|kmod-mediatek_hnat|kmod-warp|luci-app-mtwifi-cfg|luci-app-turboacc-mtk|luci-app-eqos-mtk)=' .config || true
          echo "=== 版本 ==="
          grep -E '^CONFIG_VERSION_(DIST|NUMBER)=' .config || true

      - name: 校验关键符号未被 defconfig 丢弃
        working-directory: src
        run: |
          set -euo pipefail
          miss=0
          for s in \
            "CONFIG_TARGET_DEVICE_mediatek_filogic_DEVICE_${{ inputs.DEVICE_PROFILE }}=y" \
            "CONFIG_PACKAGE_kmod-mt_wifi=y" \
            "CONFIG_PACKAGE_kmod-mediatek_hnat=y" \
            "CONFIG_MTK_MT_WIFI=m" \
            "CONFIG_MTK_CHIP_MT7981=y"
          do
            grep -qxF "$s" .config || { echo "::error::缺失 $s"; miss=1; }
          done
          [ "$miss" -eq 0 ] || { echo "::error::defconfig 丢弃了关键符号，请检查依赖"; exit 1; }
          echo "关键符号校验通过"

      - name: 下载依赖源码包
        working-directory: src
        run: |
          set -euo pipefail
          for i in 1 2 3; do
            make download -j"$(nproc)" V=s && break
            echo "下载第 $i 次失败，重试..."
            sleep 5
          done

      - name: 编译
        working-directory: src
        run: |
          set -euo pipefail
          make -j"$(nproc)" V=sc 2>&1 | tee ../build.log || {
            echo "::error::编译失败"; exit 1; }

      - name: 整理产物
        if: always()
        working-directory: src
        run: |
          mkdir -p ../out
          echo "=== 闭源驱动模块 ==="
          ls -l bin/targets/mediatek/filogic/packages/kmod-mt_wifi*.ipk 2>/dev/null || echo "(kmod-mt_wifi 未单独输出)"
          find bin/targets/mediatek/filogic -maxdepth 1 \
            \( -name '*.itb' -o -name '*.bin' -o -name '*.img' -o -name '*.ubi' \) \
            -exec cp -f {} ../out/ \;
          cp -f bin/targets/mediatek/filogic/sha256sums ../out/ 2>/dev/null || true
          cp -f .config ../out/config.buildinfo 2>/dev/null || true
          ls -lh ../out/

      - name: 上传固件
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: 360T7-immortalwrt-2512-closedwifi
          path: out/*
          if-no-files-found: warn

      - name: 上传编译日志
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
